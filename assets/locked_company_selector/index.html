<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }
    html, body { margin: 0; padding: 0; background: transparent; }
    body { min-height: 4.75rem; }
    .field { width: 100%; min-height: 4.75rem; }
    label {
      display: block;
      margin: 0 0 0.42rem 0.1rem;
      color: #1d1d1f;
      font-size: 0.92rem;
      line-height: 1.2;
    }
    select {
      box-sizing: border-box;
      width: 100%;
      min-height: 2.55rem;
      padding: 0.55rem 2rem 0.55rem 0.75rem;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 14px;
      outline: none;
      background: rgba(255, 255, 255, 0.96);
      color: #1d1d1f;
      font: inherit;
      font-size: 0.9rem;
      letter-spacing: -0.01em;
      text-overflow: clip;
      white-space: nowrap;
    }
    select:focus {
      border-color: #0071e3;
      box-shadow: 0 0 0 1px #0071e3;
    }
    option:disabled {
      color: #8e8e93;
      background: #f1f1f3;
    }
  </style>
</head>
<body>
  <div class="field">
    <label id="selector-label"></label>
    <select id="selector"></select>
  </div>
  <script>
    const parentWindow = window.parent;
    const labelElement = document.getElementById("selector-label");
    const selectElement = document.getElementById("selector");
    let readySent = false;

    function sendMessage(type, payload) {
      parentWindow.postMessage(
        Object.assign({ isStreamlitMessage: true, type: type }, payload || {}),
        "*"
      );
    }

    function setFrameHeight() {
      // Streamlit starts custom components at zero height until this message
      // arrives. Keep a stable minimum so the selector cannot collapse during
      // the first render or a state update.
      const height = Math.max(document.body.scrollHeight, 76);
      sendMessage("streamlit:setFrameHeight", { height: height });
    }

    function render(args) {
      const options = Array.isArray(args.options) ? args.options : [];
      labelElement.textContent = args.label || "Company";
      selectElement.innerHTML = "";

      options.forEach((item) => {
        const option = document.createElement("option");
        option.value = item.value;
        option.textContent = item.label;
        option.title = item.label;
        option.disabled = Boolean(item.locked);
        if (option.disabled) {
          option.style.color = "#8e8e93";
          option.style.backgroundColor = "#f1f1f3";
        }
        selectElement.appendChild(option);
      });

      if (args.selected !== undefined && args.selected !== null) {
        selectElement.value = args.selected;
      }
      const selectedOption = options.find((item) => item.value === selectElement.value);
      selectElement.title = selectedOption ? selectedOption.label : "";
      requestAnimationFrame(setFrameHeight);
      setTimeout(setFrameHeight, 0);
    }

    selectElement.addEventListener("change", () => {
      sendMessage("streamlit:setComponentValue", { value: selectElement.value });
    });

    window.addEventListener("message", (event) => {
      // Streamlit's forward render messages use the message type directly;
      // the isStreamlitMessage marker is used on messages sent back to the
      // parent, not on these iframe-bound render messages.
      if (!event.data) return;
      if (event.data.type === "streamlit:render") {
        render(event.data.args || {});
      }
    });

    // Give Streamlit time to register its message listener before announcing
    // readiness. Sending immediately can race the parent and leave an empty
    // select element with no rendered options.
    window.setTimeout(() => {
      if (readySent) return;
      readySent = true;
      sendMessage("streamlit:componentReady", { apiVersion: 1 });
      setFrameHeight();
    }, 50);
  </script>
</body>
</html>
